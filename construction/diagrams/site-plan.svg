<rect x="502.5" y="320.0" width="175.0" height="140.0" rx="0" fill="#eef7ee" stroke="#3f9142" stroke-width="3"/>
<text x="590.0" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">SECURE RUN</text>
<text x="590.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#616e7c" text-anchor="middle" font-weight="normal">20 x 25 ft (500 sq ft)</text>
<text x="590.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#616e7c" text-anchor="middle" font-weight="normal">netted, 24" apron</text>
