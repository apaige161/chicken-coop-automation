# Connectivity, time, diagnostics, sun position and supply monitoring.

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Keep running if HA is gone for a long time. Never reboot the coop controller
  # just because HA is down, because a reboot mid-move would stop the door.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Don't reboot if WiFi drops. Local logic must keep running.
  reboot_timeout: 0s
  ap:
    ssid: "Coop-Controller-Setup"
    password: !secret fallback_ap_password

captive_portal:

# Local web UI: control the coop from a phone on the LAN without Home Assistant.
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}

sun:
  id: sun_pos
  latitude: ${latitude}
  longitude: ${longitude}
  time_id: sntp_time

status_led:
  pin:
    number: GPIO2   # STATUS_LED - onboard LED + panel LED on J12
    # Strapping pin: the LED + resistor to GND keeps it low at boot, which is the
    # normal (flash-boot-compatible) state, so this is safe.
    ignore_strapping_warning: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: sun
    name: "Sun Elevation"
    type: elevation
    update_interval: 120s
  - platform: adc
    pin: GPIO36   # VIN_SENSE - 12 V rail via 100k/22k divider
    id: supply_voltage
    name: "12V Supply Voltage"
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    filters:
      - multiply: ${vin_divider_ratio}
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1

binary_sensor:
  - platform: status
    name: "Controller Online"
  - platform: template
    name: "12V Supply Low"
    device_class: problem
    # Below 11.5 V: PSU failing or backup battery running down.
    lambda: 'return id(supply_voltage).state < 11.5;'

text_sensor:
  - platform: sun
    name: "Next Sunrise"
    type: sunrise
  - platform: sun
    name: "Next Sunset"
    type: sunset

button:
  - platform: restart
    name: "Restart Controller"
    entity_category: config
