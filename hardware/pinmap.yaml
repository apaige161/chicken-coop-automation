# Single source of truth for controller GPIO + connector assignments.
# Consumed by: tools/check_consistency.py, pcb/generate.py, docs.
# Board: ESP32-DevKitC-32E (38-pin). Change here first, then regenerate/check.

board: esp32dev
pins:
  - {gpio: 21, signal: I2C_SDA,        dir: io,  connector: J9}
  - {gpio: 22, signal: I2C_SCL,        dir: out, connector: J9}
  - {gpio: 4,  signal: ONEWIRE,        dir: io,  connector: J8}
  - {gpio: 25, signal: DOOR_OPEN_RLY,  dir: out, connector: J2}
  - {gpio: 26, signal: DOOR_CLOSE_RLY, dir: out, connector: J2}
  - {gpio: 32, signal: DOOR_CLOSED_SW, dir: in,  connector: J3}
  - {gpio: 33, signal: DOOR_OPEN_SW,   dir: in,  connector: J3}
  - {gpio: 27, signal: VALVE_DRV,      dir: out, connector: J4}
  - {gpio: 13, signal: FEEDER_DRV,     dir: out, connector: J5}
  - {gpio: 14, signal: FAN_DRV,        dir: out, connector: J14}
  - {gpio: 16, signal: LIGHT_SSR,      dir: out, connector: J6}
  - {gpio: 17, signal: HEAT_SSR,       dir: out, connector: J6}
  - {gpio: 34, signal: WATER_LOW,      dir: in,  connector: J7}
  - {gpio: 35, signal: WATER_HIGH,     dir: in,  connector: J7}
  - {gpio: 39, signal: PIR,            dir: in,  connector: J10}
  - {gpio: 18, signal: US_TRIG,        dir: out, connector: J11}
  - {gpio: 19, signal: US_ECHO,        dir: in,  connector: J11}
  - {gpio: 23, signal: DOOR_BTN,       dir: in,  connector: J12}
  - {gpio: 2,  signal: STATUS_LED,     dir: out, connector: J12}
  - {gpio: 36, signal: VIN_SENSE,      dir: adc, connector: null}
  - {gpio: 5,  signal: SPARE_IO5,      dir: io,  connector: J13}

connectors:
  J1:  {name: PWR_IN,     pins: ["VIN_RAW", "GND"]}   # VIN_RAW = +12 V in, before fuse/diode
  J2:  {name: ACTUATOR,   pins: ["M+", "M-"]}
  J3:  {name: DOOR_SW,    pins: ["DOOR_CLOSED_SW", "DOOR_OPEN_SW", "GND"]}
  J4:  {name: VALVE,      pins: ["+12V", "VALVE-"]}
  J5:  {name: FEEDER,     pins: ["+12V", "FEEDER-"]}
  J6:  {name: SSR_OUT,    pins: ["+12V", "LIGHT_SSR-", "+12V", "HEAT_SSR-"]}
  J7:  {name: WATER_LVL,  pins: ["WATER_LOW", "WATER_HIGH", "GND"]}
  J8:  {name: ONEWIRE,    pins: ["+3V3", "ONEWIRE", "GND"]}
  J9:  {name: I2C,        pins: ["+3V3", "I2C_SDA", "I2C_SCL", "GND"]}
  J10: {name: PIR,        pins: ["+5V", "PIR", "GND"]}
  J11: {name: ULTRASONIC, pins: ["+5V", "US_TRIG", "US_ECHO_5V", "GND"]}
  J12: {name: PANEL,      pins: ["DOOR_BTN", "GND", "LED_PANEL", "GND"]}
  J13: {name: EXPANSION,  pins: ["+3V3", "GND", "+5V", "I2C_SDA", "I2C_SCL", "SPARE_IO5"]}
  J14: {name: FAN,        pins: ["+12V", "FAN-"]}
