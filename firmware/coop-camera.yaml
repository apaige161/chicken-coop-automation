# OPTIONAL coop camera: AI-Thinker ESP32-CAM running ESPHome. It shows up in Home
# Assistant as a camera entity. Power it from 5 V (J10/J11 5 V on the controller, or its
# own 5 V 2 A supply). Print 3d-printing/camera_mount.scad for the housing.
#
# For better image quality, night vision and recording, use a PoE/WiFi RTSP camera and
# add it to HA directly instead (see docs/home-assistant.md).

substitutions:
  name: coop-camera
  friendly_name: Coop Camera
  timezone: "America/New_York"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret camera_api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret camera_api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Coop-Camera-Setup"
    password: !secret fallback_ap_password

captive_portal:

psram:

time:
  - platform: homeassistant
    timezone: ${timezone}

i2c:
  id: cam_i2c
  sda: GPIO26
  scl: GPIO27

esp32_camera:
  name: "Coop Camera"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: cam_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 800x600
  jpeg_quality: 12
  max_framerate: 5 fps
  idle_framerate: 0.1 fps

# The onboard white "flash" LED doubles as a small night light for a snapshot.
output:
  - platform: ledc
    id: flash_output
    pin: GPIO4
    channel: 2

light:
  - platform: monochromatic
    name: "Coop Camera Flash"
    output: flash_output
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "Camera WiFi Signal"
    update_interval: 120s
